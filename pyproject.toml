[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rocm-stack-manager"
version = "0.1.0"
description = "Manage ROCm application environments without assuming a fixed installation path."
requires-python = ">=3.10"
dependencies = ["packaging>=24"]

[project.optional-dependencies]
ui = ["PySide6>=6.11.1,<7"]
dev = [
  "deptry>=0.23",
  "prek>=0.5.2,<0.6",
  "pyright>=1.1.390",
  "ruff>=0.16",
  "vulture>=2.14",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".venv", "backups"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
include = ["src"]
exclude = ["tests", ".venv", "backups"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingImports = "warning"

[tool.deptry]
optional_dependencies_dev_groups = ["dev"]

[project.scripts]
rocm-stack-manager = "rocm_stack_manager.cli:main"
rocm-stack-manager-gui = "rocm_stack_manager.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
